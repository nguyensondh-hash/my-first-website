<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Toán 6 – Học dễ hiểu</title>
    <!-- Thư viện Supabase kết nối hệ thống tài khoản -->
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        /* CSS Khung Đăng ký / Đăng nhập */
        #auth-container { max-width: 400px; margin: 80px auto; padding: 30px; background: white; border-radius: 16px; border: 1px solid #d8dcf0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); font-family: "Be Vietnam Pro", sans-serif; }
        #auth-container h2 { text-align: center; color: #4b5bd7; margin-bottom: 25px; font-weight: 800; font-size: 1.6rem; border: none; padding: 0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #1b2140; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #d8dcf0; border-radius: 10px; box-sizing: border-box; font-size: 15px; }
        .auth-btn { width: 100%; padding: 12px; background-color: #4b5bd7; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: 600; transition: 0.2s; }
        .auth-btn:hover { background-color: #3a4bb5; }
        .auth-btn-alt { background-color: transparent; color: #4b5bd7; margin-top: 15px; border: 1px solid #4b5bd7; }
        .auth-btn-alt:hover { background-color: #f1f3fb; }
        .error-msg { color: #d64545; font-size: 14px; margin-top: 10px; text-align: center; font-weight: 600; }
        .success-msg { color: #1f9d57; font-size: 14px; margin-top: 10px; text-align: center; font-weight: 600; }

        /* CSS Giao diện bài học Toán 6 cũ của bạn */
        :root{--bg:#f1f3fb;--card:#fff;--ink:#1b2140;--mute:#5d6485;--line:#d8dcf0;--accent:#4b5bd7;--accent-ink:#fff;--soft:#e6e9fb;--ok:#1f9d57;--bad:#d64545;
        box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
        @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--card:#181c36;--ink:#e8ebfb;--mute:#9aa2c8;--line:#2a3058;--accent:#8c98ff;--accent-ink:#0d1030;--soft:#222850;--ok:#4cc382;--bad:#ff7b7b}}
        :root[data-theme="dark"]{--bg:#0f1226;--card:#181c36;--ink:#e8ebfb;--mute:#9aa2c8;--line:#2a3058;--accent:#8c98ff;--accent-ink:#0d1030;--soft:#222850;--ok:#4cc382;--bad:#ff7b7b}
        html{scroll-padding-top:env(safe-area-inset-top,0px)}
        body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
        header{padding:28px 16px 10px;max-width:820px;margin:0 auto}
        h1{font-size:2rem;font-weight:800;margin:0;letter-spacing:-.02em}
        h2{font-size:1.35rem;margin:0 0 10px}
        h3{font-size:1.05rem;margin:0 0 6px}
        .sub{color:var(--mute);margin:2px 0 0}
        nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
        nav div{max-width:820px;margin:0 auto;display:flex;gap:6px;overflow-x:auto}
        nav button{white-space:nowrap}
        main{max-width:820px;margin:0 auto;padding:16px 16px 56px;display:grid;gap:14px}
        .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
        button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px}
        button[aria-current="page"],button[aria-pressed="true"],button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
        button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
        details{border-top:1px solid var(--line);padding:10px 0}
        details:first-of-type{border-top:0}
        summary{cursor:pointer;font-weight:600}
        ul{margin:8px 0 0;padding-left:20px}
        li{margin:4px 0}
        .f{background:var(--soft);border-radius:10px;padding:8px 12px;margin:6px 0;font-weight:600}
        .tag{display:inline-block;font-size:.78rem;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:600}
        fieldset{border:0;padding:0;margin:0 0 14px}
        legend{font-weight:600;padding:0;margin-bottom:4px}
        .opt{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
        .opt input{width:18px;height:18px;accent-color:var(--accent)}
        .opt.ok{color:var(--ok);font-weight:600}.opt.bad{color:var(--bad);font-weight:600}
        .res{margin-top:10px;font-weight:600}
        .sol{color:var(--mute);margin:6px 0 0}
        [hidden]{display:none!important}
    </style>
</head>
<body>

    <!-- KHUNG ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-container">
        <h2 id="auth-title">Đăng Nhập Học Tập</h2>
        <div class="form-group">
            <label for="email">Email của phụ huynh/học sinh:</label>
            <input type="email" id="email" placeholder="example@gmail.com">
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu ít nhất 6 ký tự">
        </div>
        
        <button class="auth-btn" id="btn-primary" onclick="handleAuth()">Đăng Nhập</button>
        <button class="auth-btn auth-btn-alt" id="btn-toggle" onclick="toggleMode()">Chưa có tài khoản? Đăng ký ngay</button>
        
        <div id="message" class="error-msg" style="display: none;"></div>
    </div>

    <!-- NỘI DUNG BÀI HỌC TOÁN 6 CŨ CỦA BẠN (SẼ HIỂN THỊ SAU KHI ĐĂNG NHẬP) -->
    <div id="main-content" style="display: none;">
        <div style="max-width: 820px; margin: 10px auto; text-align: right; padding-right: 16px; font-family: sans-serif; font-size: 14px;">
            Thành viên: <span id="user-email" style="font-weight: bold; color: #4b5bd7;"></span> | 
            <a href="#" onclick="logout()" style="color: #d64545; font-weight: bold; text-decoration: none;">Đăng xuất</a>
        </div>

        <header>
          <h1>Toán 6 – Học dễ hiểu</h1>
          <p class="sub">Miễn phí cho học sinh lớp 6, theo sách Kết nối tri thức với cuộc sống (học kì 1 và học kì 2).</p>
        </header>
        <nav aria-label="Mục chính"><div id="nv"></div></nav>
        <main id="mn"></main>
    </div>

    <!-- KHU VỰC JAVASCRIPT XỬ LÝ ĐĂNG NHẬP & DỮ LIỆU BÀI HỌC -->
    <script>
        // ==========================================
        // 1. CẤU HÌNH SUPABASE (HÃY ĐIỀN THÔNG TIN CỦA BẠN VÀO ĐÂY)
        // ==========================================
        const SUPABASE_URL = "DÁN_URL_DỰ_ÁN_CỦA_BẠN_VÀO_ĐÂY"; 
        const SUPABASE_ANON_KEY = "DÁN_PUBLISHABLE_KEY_CỦA_BẠN_VÀO_ĐÂY";

        // Khởi tạo kết nối Supabase Client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let isLoginMode = true;

        // Hàm chuyển đổi giao diện Đăng ký / Đăng nhập
        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Đăng Nhập Học Tập" : "Đăng Ký Tài Khoản Mới";
            document.getElementById('btn-primary').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký";
            document.getElementById('btn-toggle').innerText = isLoginMode ? "Chưa có tài khoản? Đăng ký ngay" : "Đã có tài khoản? Đăng nhập";
            const msgDiv = document.getElementById('message');
            msgDiv.style.display = 'none';
            msgDiv.innerText = "";
        }

        // Hàm xử lý hành động khi bấm nút chính
        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('message');
            msgDiv.style.display = 'none';
            msgDiv.innerText = "";

            if (!email || !password) {
                msgDiv.className = "error-msg";
                msgDiv.style.display = "block";
                msgDiv.innerText = "Vui lòng nhập đầy đủ Email và Mật khẩu.";
                return;
            }

            if (isLoginMode) {
                // Xử lý Đăng nhập
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    msgDiv.className = "error-msg";
                    msgDiv.style.display = "block";
                    msgDiv.innerText = "Lỗi đăng nhập: " + error.message;
                } else {
                    checkUserSession();
                }
            } else {
                // Xử lý Đăng ký thành viên mới
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    msgDiv.className = "error-msg";
                    msgDiv.style.display = "block";
                    msgDiv.innerText = "Lỗi đăng ký: " + error.message;
                } else if (data.session) {
                    checkUserSession();
                } else {
                    msgDiv.className = "success-msg";
                    msgDiv.style.display = "block";
                    msgDiv.innerText = "Tài khoản đã tạo! Vui lòng chuyển sang 'Đăng nhập'.";
                }
            }
        }

        // Hàm tự động kiểm tra trạng thái đăng nhập
        async function checkUserSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
