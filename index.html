const HKEY='toan6-hist';

function test(T){
 const w=el('div');w.style.display='grid';w.style.gap='14px';
 const h=card();h.innerHTML='<h2>'+T.t+'</h2><p class="sub">'+T.time+'</p>';w.append(h);
 const m=card();const pt=T.pt||0.25,fm=x=>String(+x.toFixed(2)).replace('.',',');m.append(el('h3',null,'Phần I. Trắc nghiệm (mỗi câu '+fm(pt)+' điểm)'));
 const fs=[];
 T.mcq.forEach((q,i)=>{const f=el('fieldset');f.append(el('legend',null,'Câu '+(i+1)+'. '+q[0]));
  q[1].forEach((o,j)=>{const lb=el('label','opt');const r=document.createElement('input');r.type='radio';r.name='q'+T.t+i;r.value=j;lb.append(r,document.createTextNode(L[j]+'. '+o));f.append(lb)});
  m.append(f);fs.push(f)});
 const rs=el('div','res');const bt=el('button','primary','Nộp bài và chấm');
 bt.onclick=()=>{let ok=0;T.mcq.forEach((q,i)=>{const f=fs[i],ch=f.querySelector('input:checked');f.querySelectorAll('.opt').forEach((lb,j)=>{lb.classList.remove('ok','bad');if(j===q[2])lb.classList.add('ok');else if(ch&&+ch.value===j)lb.classList.add('bad')});if(ch&&+ch.value===q[2])ok++});
  rs.textContent='Đúng '+ok+'/'+T.mcq.length+' câu, được '+fm(ok*pt)+'/'+fm(T.mcq.length*pt)+' điểm trắc nghiệm. Đáp án đúng được tô xanh. Đã lưu vào Lịch sử điểm.';saveH(T.t,ok*pt,T.mcq.length*pt);if(T.onDone)T.onDone()};
 const rb=el('button',null,'Làm lại');rb.onclick=()=>{fs.forEach(f=>{f.querySelectorAll('input').forEach(i=>i.checked=false);f.querySelectorAll('.opt').forEach(l=>l.classList.remove('ok','bad'))});rs.textContent=''};
 const row=el('div');row.style.display='flex';row.style.gap='8px';row.append(bt,rb);m.append(row,rs);if(T.mcq.length)w.append(m);
 const t=card();t.append(el('h3',null,'Phần II. Tự luận ('+(T.tlp||7)+' điểm)'));
 T.tl.forEach(x=>{t.append(el('p',null,x[0]));const d=el('details');d.append(el('summary',null,'Xem đáp án'),el('p','sol',x[1]));t.append(d)});
 if(T.tl.length)w.append(t);return w}

V.lt=()=>{
 let cur=0,it=null,ok=0,all=0,done=false;
 const c=card();c.append(el('h2',null,'Luyện tập ngẫu nhiên'),el('p','sub','Chọn dạng bài, trả lời rồi chấm. Mỗi lần ra số khác nhau.'));
 const chips=el('div');chips.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin:10px 0';
 const q=el('div');q.style.cssText='font-size:1.4rem;font-weight:800;margin:10px 0';
 const row=el('div');row.style.cssText='display:flex;gap:8px;flex-wrap:wrap';
 const inp=document.createElement('input');inp.type='text';inp.setAttribute('aria-label','Đáp án');inp.style.cssText='font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:150px';
 const fb=el('div','res'),sc=el('p','sub','Chưa làm câu nào.');
 function draw(){chips.innerHTML='';GEN.forEach((g,i)=>{const b=el('button',null,g[0]);if(i===cur)b.setAttribute('aria-current','page');b.onclick=()=>{cur=i;draw();nx()};chips.append(b)})}
 function judge(v){if(done||v!==v)return;done=true;all++;const g=v===it.a;if(g)ok++;fb.style.color=g?'var(--ok)':'var(--bad)';fb.innerHTML=g?'Đúng rồi!':'Chưa đúng. Đáp án: '+(it.yn?(it.a?'Có':'Không'):it.a)+'. Gợi ý: '+it.h;sc.textContent='Đúng '+ok+'/'+all+' câu.'}
 function nx(){it=GEN[cur][1]();done=false;q.innerHTML=it.q;fb.textContent='';inp.value='';row.innerHTML='';

  const n=el('button',null,'Câu mới');n.onclick=nx;row.append(n)}
 inp.onkeydown=e=>{if(e.key==='Enter'){if(done)nx();else row.querySelector('.primary').click()}};

V.lt=()=>{
 const G=sem===1?GEN:GEN2;
 let cur=0,it=null,ok=0,all=0,done=false;
 const c=card();c.append(el('h2',null,'Luyện tập ngẫu nhiên – học kì '+sem),el('p','sub','Chọn dạng bài, trả lời rồi chấm ngay. Phân số nhập dạng 3/4 và phải rút gọn; số thập phân dùng dấu phẩy hoặc dấu chấm.'));
 const chips=el('div');chips.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin:10px 0';
 const q=el('div');q.style.cssText='font-size:1.4rem;font-weight:800;margin:10px 0';
 const row=el('div');row.style.cssText='display:flex;gap:8px;flex-wrap:wrap';
 const inp=document.createElement('input');inp.type='text';inp.setAttribute('aria-label','Đáp án');inp.style.cssText='font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:150px';
 const fb=el('div','res'),sc=el('p','sub','Chưa làm câu nào.');
 const sv=el('button',null,'Lưu kết quả vào lịch sử');sv.style.marginTop='6px';
 sv.onclick=()=>{if(!all){sc.textContent='Hãy làm ít nhất một câu trước khi lưu.';return}saveH('Luyện tập học kì '+sem,ok,all);sc.textContent='Đã lưu '+ok+'/'+all+' câu vào Lịch sử điểm.';ok=0;all=0};
 function draw(){chips.innerHTML='';G.forEach((g,i)=>{const b=el('button',null,g[0]);if(i===cur)b.setAttribute('aria-current','page');b.onclick=()=>{cur=i;draw();nx()};chips.append(b)})}
 function judge(raw){if(done)return;let g;
  if(it.yn)g=raw===it.a;
  else if(it.f){const p=String(raw).trim().split('/'),n=parseInt(p[0]),d=p.length>1?parseInt(p[1]):1;if(n!==n||!(d>0))return;g=n*it.f.d===it.f.n*d&&gcd(Math.abs(n),d)===1}
  else{const v=parseFloat(String(raw).replace(',','.').replace('−','-'));if(v!==v)return;g=Math.abs(v-it.a)<1e-9}
  done=true;all++;if(g)ok++;fb.style.color=g?'var(--ok)':'var(--bad)';
  fb.innerHTML=g?'Đúng rồi!':'Chưa đúng. Đáp án: '+(it.yn?(it.a?'Có':'Không'):it.f?FR(it.f.n,it.f.d):dc(it.a))+'. Gợi ý: '+it.h;
  sc.textContent='Đúng '+ok+'/'+all+' câu.'}
 function nx(){it=G[cur][1]();done=false;q.innerHTML=it.q;fb.textContent='';inp.value='';inp.placeholder=it.f?'ví dụ: 3/4':'';row.innerHTML='';
  if(it.yn){['Có','Không'].forEach((t,i)=>{const b=el('button',null,t);b.onclick=()=>judge(i===0?1:0);row.append(b)})}
  else{const b=el('button','primary','Kiểm tra');b.onclick=()=>judge(inp.value);row.append(inp,b)}
  const n=el('button',null,'Câu mới');n.onclick=nx;row.append(n)}
 inp.onkeydown=e=>{if(e.key==='Enter'){if(done)nx();else judge(inp.value)}};
 c.append(chips,q,row,fb,sc,sv);draw();nx();return c};

 const tn=j.trac_nghiem||[],tl=j.tu_luan||[],pt=+j.diem_moi_cau||0.25,tp=Math.round((10-pt*tn.length)*100)/100;
 return{t:j.tieu_de||'Đề kiểm tra',time:[j.thoi_gian||'',tn.length?tn.length+' câu trắc nghiệm ('+dcm(pt*tn.length)+' điểm)':'',tl.length?tl.length+' bài tự luận ('+dcm(tp)+' điểm)':''].filter(Boolean).join(' · '),pt,tlp:dcm(tp),
  mcq:tn.map(x=>[esc(x.q),(x.o||[]).slice(0,4),+x.a]),tl:tl.map(x=>[esc(x.de),esc(x.giai||'')]),onDone}}
function bankView(kind){
 const w=el('div');w.style.cssText='display:grid;gap:14px';
 const info=card();info.append(P2('Đang tải ngân hàng đề…'));
 const host=el('div');w.append(info,host);
 loadBank().then(all=>{
  const L=all.filter(x=>x.loai===LK[kind]&&+x.hoc_ki===sem);info.innerHTML='';
  if(!L.length){info.append(el('h3',null,'Ngân hàng đề'),P2('Chưa có đề nào cho mục này, hoặc trang đang chạy ngoài GitHub Pages nên chưa đọc được thư mục ngan-hang-de. Bạn có thể dùng "Đề tự động", hoặc thêm đề vào thư mục theo hướng dẫn.'));return}
  const dangs=[...new Set(L.map(x=>x.dang||'Khác'))];let dg='';
  const top=el('div');top.style.cssText='display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0';
  const sel=document.createElement('select');sel.setAttribute('aria-label','Chọn dạng đề');sel.style.cssText=INP2+';width:auto;max-width:100%';
  [['','Tất cả các dạng']].concat(dangs.map(d=>[d,d])).forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.append(o)});
  const rnd=el('button','primary','Chọn đề ngẫu nhiên');const cnt=el('p','sub'),lst=el('div');lst.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin-top:8px';
  const cur=()=>L.filter(x=>!dg||(x.dang||'Khác')===dg);
  function open(x){host.innerHTML='';host.append(P2('Đang mở đề…'));
   fetch(BASE+x.f,{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{host.innerHTML='';host.append(test(toT(j,()=>{doneSet(x.f);draw()})))}).catch(()=>{host.innerHTML='';host.append(P2('Không mở được đề này. Hãy thử lại sau.'))})}
  function draw(){const C=cur(),D=doneGet();lst.innerHTML='';
   C.forEach((x,i)=>{const b=el('button',null,'Đề '+(i+1)+(D[x.f]?' ✓':''));b.title=(x.tieu_de||'')+(x.dang?' – '+x.dang:'');b.onclick=()=>open(x);lst.append(b)});
   cnt.textContent='Có '+C.length+' đề; bạn đã làm '+C.filter(x=>D[x.f]).length+'. Dấu ✓ là đề đã nộp bài. Rê chuột vào nút để xem tên đề.'}
  sel.onchange=()=>{dg=sel.value;draw()};
  rnd.onclick=()=>{const C=cur(),D=doneGet(),fresh=C.filter(x=>!D[x.f]),pool=fresh.length?fresh:C;if(pool.length)open(pool[Math.floor(Math.random()*pool.length)])};
  top.append(sel,rnd);info.append(el('h3',null,'Ngân hàng đề: '+L.length+' đề'),el('p','sub','Chọn dạng, bấm một đề cụ thể hoặc bấm "Chọn đề ngẫu nhiên" (ưu tiên đề bạn chưa làm).'),top,cnt,lst);draw()});
 return w}
function kho(kind){
 const w=el('div');w.style.cssText='display:grid;gap:14px';
 const head=card();head.append(el('h2',null,KN[kind]+' – học kì '+sem));
 const modes=el('div'),body=el('div');modes.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin:8px 0';let mode='bank';
 function draw(){modes.innerHTML='';[['bank','Ngân hàng đề'],['auto','Đề tự động']].forEach(([m,t])=>{const b=el('button',null,t);if(m===mode)b.setAttribute('aria-current','page');b.onclick=()=>{mode=m;draw();render()};modes.append(b)})}
 function render(){body.innerHTML='';body.append(mode==='bank'?bankView(kind):autoView(kind))}
 head.append(modes);w.append(head,body);draw();render();return w}
V.t15=()=>kho('t15');V.t45=()=>kho('t45');V.hk=()=>kho('hk');

const NAV=[['home','Trang chủ'],['kt','Kiến thức'],['fm','Công thức'],['dt','Dạng toán'],['bt','Bài tập'],['lt','Luyện tập'],['t15','KT 15 phút'],['t45','KT 45 phút'],['hk','Thi học kì'],['ls','Lịch sử điểm']];
let curK='home';function show(k){curK=k;
 $('nv').querySelectorAll('button').forEach(b=>{if(b.dataset.k===k)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 const m=$('mn');m.innerHTML='';m.append(V[k]());window.scrollTo(0,0);
}
function buildNav(){const nv=$('nv');nv.innerHTML='';
 [1,2].forEach(s=>{const b=el('button',null,'Học kì '+s);b.setAttribute('aria-pressed',s===sem);b.onclick=()=>{sem=s;try{localStorage.setItem('toan6-sem',s)}catch(e){}buildNav();show(curK)};nv.append(b)});
 NAV.forEach(([k,t])=>{const b=el('button',null,k==='hk'?'Thi học kì '+sem:t);b.dataset.k=k;b.onclick=()=>show(k);nv.append(b)})}
buildNav();
show('home');
</script>
