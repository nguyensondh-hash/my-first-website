const KT=[
{t:'Chương 1. Số tự nhiên',p:['Tập hợp: ký hiệu ∈, ∉, ⊂; viết bằng cách liệt kê hoặc nêu tính chất. ℕ = {0; 1; 2; …}, ℕ* = {1; 2; 3; …}.','Cách ghi số thập phân, số La Mã; so sánh và thứ tự số tự nhiên.','Cộng, trừ, nhân, chia; tính chất giao hoán, kết hợp, phân phối. Phép chia có dư: a = b·q + r (0 ≤ r < b).','Lũy thừa: aⁿ là tích của n thừa số a.','Thứ tự phép tính: ngoặc ( ) → [ ] → { }; rồi lũy thừa → nhân, chia → cộng, trừ.']},
{t:'Chương 2. Tính chia hết',p:['a chia hết cho b (b ≠ 0) khi có số tự nhiên q sao cho a = b·q. Khi đó b là ước của a, a là bội của b.','Dấu hiệu chia hết cho 2, 5, 3, 9.','Số nguyên tố: lớn hơn 1, chỉ có hai ước là 1 và chính nó. Hợp số: có từ ba ước trở lên. Số 0 và 1 không là số nguyên tố, cũng không là hợp số.','Phân tích một số ra thừa số nguyên tố.','ƯCLN: lấy thừa số chung, số mũ nhỏ nhất. BCNN: lấy thừa số chung và riêng, số mũ lớn nhất.']},
{t:'Chương 3. Số nguyên',p:['ℤ = {…; −2; −1; 0; 1; 2; …}. Số đối của a là −a. Giá trị tuyệt đối |a| là khoảng cách từ a đến 0 trên trục số.','Số nguyên âm nhỏ hơn 0, nhỏ hơn mọi số nguyên dương; trên trục số, số bên trái nhỏ hơn.','Cộng, trừ, nhân, chia hết các số nguyên theo quy tắc dấu.','Quy tắc dấu ngoặc: bỏ ngoặc có dấu − phía trước thì đổi dấu mọi số hạng trong ngoặc.']},
{t:'Chương 4. Một số hình phẳng trong thực tiễn',p:['Tam giác đều: ba cạnh bằng nhau, ba góc bằng nhau. Hình vuông: bốn cạnh bằng nhau, bốn góc vuông. Lục giác đều: sáu cạnh bằng nhau, sáu góc bằng nhau.','Hình chữ nhật: bốn góc vuông, các cạnh đối bằng nhau, hai đường chéo bằng nhau. Hình thoi: bốn cạnh bằng nhau, các cạnh đối song song, hai đường chéo vuông góc.','Hình bình hành: các cạnh đối song song và bằng nhau. Hình thang cân: hai cạnh đáy song song, hai cạnh bên bằng nhau.']},
{t:'Chương 5. Tính đối xứng của hình phẳng',p:['Hình có trục đối xứng: gấp theo trục thì hai phần trùng khít.','Hình có tâm đối xứng: quay nửa vòng quanh tâm thì hình trùng với chính nó.','Số trục đối xứng: tam giác đều 3, hình vuông 4, hình chữ nhật 2, hình thoi 2, lục giác đều 6.']}
];

{t:'Dấu hiệu chia hết',f:['Cho 2: chữ số tận cùng chẵn','Cho 5: tận cùng 0 hoặc 5','Cho 3 (hoặc 9): tổng các chữ số chia hết cho 3 (hoặc 9)']},
{t:'ƯCLN và BCNN',f:['ƯCLN: thừa số chung, mũ nhỏ nhất','BCNN: thừa số chung và riêng, mũ lớn nhất','ƯCLN(a, b) · BCNN(a, b) = a · b']},

{t:'Chu vi và diện tích',f:['Hình chữ nhật: P = 2(a + b); S = a · b','Hình vuông: P = 4a; S = a²','Hình thoi: S = (m · n) : 2 (m, n là hai đường chéo)','Hình bình hành: S = a · h; P = 2(a + b)','Hình thang cân: S = (a + b) · h : 2','Tam giác đều: P = 3a; lục giác đều: P = 6a']}
];

{t:'Thực hiện phép tính',m:'Làm đúng thứ tự: ngoặc, lũy thừa, nhân chia, cộng trừ. Có thừa số chung thì đặt ra ngoài (tính chất phân phối).',e:'a) 5 · 2³ − 18 : 3²   b) 25 · 27 + 25 · 73',s:'a) 5 · 8 − 18 : 9 = 40 − 2 = 38. b) 25 · (27 + 73) = 25 · 100 = 2 500.'},
{t:'Tìm x',m:'Chuyển vế, đổi dấu; với lũy thừa thì đưa về cùng cơ số.',e:'a) 3x − 7 = 20   b) 2ˣ = 32',s:'a) 3x = 27 nên x = 9. b) 2ˣ = 2⁵ nên x = 5.'},
{t:'Dấu hiệu chia hết',m:'Tính tổng các chữ số (cho 3, 9) hoặc nhìn chữ số tận cùng (cho 2, 5).',e:'Số 1 233 có chia hết cho 9 không?',s:'1 + 2 + 3 + 3 = 9, chia hết cho 9 nên 1 233 chia hết cho 9.'},
{t:'Phân tích ra thừa số nguyên tố',m:'Chia dần cho số nguyên tố nhỏ nhất (2, 3, 5, 7, …) đến khi thương bằng 1, rồi viết gọn bằng lũy thừa.',e:'Phân tích 60.',s:'60 : 2 = 30; 30 : 2 = 15; 15 : 3 = 5; 5 : 5 = 1. Vậy 60 = 2² · 3 · 5.'},
{t:'Tìm ƯCLN, BCNN',m:'Phân tích mỗi số ra thừa số nguyên tố rồi lấy theo quy tắc.',e:'Tìm ƯCLN và BCNN của 60 và 84.',s:'60 = 2² · 3 · 5; 84 = 2² · 3 · 7. ƯCLN = 2² · 3 = 12; BCNN = 2² · 3 · 5 · 7 = 420.'},
{t:'Toán đố chia đều (ƯCLN)',m:'Chia thành nhiều nhóm nhất, mỗi nhóm bằng nhau: dùng ƯCLN.',e:'36 học sinh nam và 48 học sinh nữ chia thành các nhóm đều nhau về số nam, số nữ. Nhiều nhất bao nhiêu nhóm?',s:'ƯCLN(36, 48) = 12 nên 12 nhóm, mỗi nhóm 3 nam và 4 nữ.'},
{t:'Toán đố lặp chu kỳ (BCNN)',m:'Bao lâu thì gặp nhau lần nữa: dùng BCNN.',e:'An trực nhật 4 ngày một lần, Bình 6 ngày một lần. Hôm nay cùng trực, sau bao lâu lại cùng trực?',s:'BCNN(4, 6) = 12 nên sau 12 ngày.'},
{t:'Tính với số nguyên',m:'Nhớ quy tắc dấu; trừ một số là cộng với số đối của nó.',e:'Tính (−12) + 20 − (−5).',s:'(−12) + 20 = 8; 8 − (−5) = 8 + 5 = 13.'},
{t:'So sánh, sắp xếp số nguyên',m:'Vẽ trục số: số bên trái nhỏ hơn số bên phải.',e:'Sắp xếp tăng dần: 5; −3; 0; −12; 8.',s:'−12 < −3 < 0 < 5 < 8.'},
{t:'Chu vi và diện tích hình phẳng',m:'Viết đúng công thức, thay số, ghi đơn vị (cm, cm²).',e:'Hình thang cân có hai đáy 14 m, 26 m, chiều cao 9 m. Tính diện tích.',s:'S = (14 + 26) · 9 : 2 = 180 m².'}
];

mcq:[

const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,gcd=(a,b)=>b?gcd(b,a%b):a,ng=x=>x<0?'('+x+')':String(x);

['Lũy thừa',()=>{const a=R(2,5),n=R(2,4);return{q:'Tính '+a+'<sup>'+n+'</sup>',a:Math.pow(a,n),h:a+'<sup>'+n+'</sup> là tích của '+n+' thừa số '+a+'.'}}],

['Chia hết',()=>{const m=[2,3,5,9][R(0,3)],n=R(100,9999),s=String(n).split('').reduce((x,y)=>x+ +y,0);const ok=m===2?n%2===0:m===5?n%5===0:s%m===0;return{q:'Số '+n+' có chia hết cho '+m+' không?',a:ok?1:0,yn:1,h:(m===3||m===9)?'Tổng các chữ số là '+s+'.':'Nhìn chữ số tận cùng.'}}],

['BCNN',()=>{let x=R(4,15),y=R(4,15);if(x===y)y++;return{q:'Tìm BCNN('+x+', '+y+')',a:x*y/gcd(x,y),h:'BCNN = tích hai số chia cho ƯCLN.'}}],
['Số nguyên',()=>{const t=R(0,2),a=R(-15,15),b=R(-15,15);if(t===0)return{q:'Tính '+ng(a)+' + '+ng(b),a:a+b,h:'Cùng dấu thì cộng giá trị tuyệt đối; khác dấu thì lấy hiệu và mang dấu của số có giá trị tuyệt đối lớn hơn.'};if(t===1)return{q:'Tính '+ng(a)+' − '+ng(b),a:a-b,h:'Trừ một số là cộng với số đối của nó.'};const x=R(-9,9),y=R(-9,9);return{q:'Tính '+ng(x)+' · '+ng(y),a:x*y,h:'Cùng dấu thì tích dương, khác dấu thì tích âm.'}}],
['Diện tích',()=>{const t=R(0,3);if(t===0){const a=R(3,15),b=R(2,12);return{q:'Hình chữ nhật dài '+a+' cm, rộng '+b+' cm. Diện tích (cm²)?',a:a*b,h:'S = dài · rộng.'}}if(t===1){const m=2*R(2,8),n=R(3,12);return{q:'Hình thoi có hai đường chéo '+m+' cm và '+n+' cm. Diện tích (cm²)?',a:m*n/2,h:'S = (đường chéo 1 · đường chéo 2) : 2.'}}if(t===2){const a=R(4,16),h=R(3,10);return{q:'Hình bình hành có đáy '+a+' cm, chiều cao '+h+' cm. Diện tích (cm²)?',a:a*h,h:'S = đáy · chiều cao.'}}const a=R(3,10),b=R(4,14),h=2*R(2,6);return{q:'Hình thang cân có hai đáy '+a+' cm và '+b+' cm, chiều cao '+h+' cm. Diện tích (cm²)?',a:(a+b)*h/2,h:'S = (đáy lớn + đáy nhỏ) · chiều cao : 2.'}}]

    <script>
        // 1. Điền thông tin Supabase của bạn vào đây
        const SUPABASE_URL = "https://keggskvibeltkothqebq.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_GYmUa9WNjhvDnhCQedwujw_V2jKPe_R";

        // Khởi tạo kết nối Supabase Client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = true; // Trạng thái ban đầu là Đăng nhập

        // 2. Hàm chuyển đổi qua lại giữa giao diện Đăng ký và Đăng nhập
        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Đăng Nhập Học Tập" : "Đăng Ký Tài Khoản Mới";
            document.getElementById('btn-primary').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký";
            document.getElementById('btn-toggle').innerText = isLoginMode ? "Chưa có tài khoản? Đăng ký ngay" : "Đã có tài khoản? Đăng nhập";
            document.getElementById('message').innerText = "";
        }

        // 3. Hàm xử lý Đăng ký hoặc Đăng nhập khi bấm nút chính
        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('message');
            msgDiv.innerText = "";

            if (!email || !password) {
                msgDiv.className = "error-msg";
                msgDiv.innerText = "Vui lòng nhập đầy đủ Email và Mật khẩu.";
                return;
            }

            if (isLoginMode) {
                // Xử lý đăng nhập
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    msgDiv.className = "error-msg";
                    msgDiv.innerText = "Lỗi đăng nhập: " + error.message;
                } else {
                    checkUserSession();
                }
            } else {
                // Xử lý đăng ký thành viên mới
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    msgDiv.className = "error-msg";
                    msgDiv.innerText = "Lỗi đăng ký: " + error.message;
                } else {
                    msgDiv.className = "success-msg";
                    msgDiv.innerText = "Đăng ký thành công! Hãy kiểm tra hộp thư Email để bấm liên kết xác nhận tài khoản trước khi đăng nhập.";
                }
            }
        }

        // 4. Hàm kiểm tra xem người dùng đã đăng nhập chưa khi tải trang
        async function checkUserSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                // Đã đăng nhập: Hiện bài học, ẩn khung đăng nhập
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('user-email').innerText = session.user.email;
            } else {
                // Chưa đăng nhập: Hiện khung đăng nhập, ẩn bài học
                document.getElementById('auth-container').style.display = 'block';
                document.getElementById('main-content').style.display = 'none';
            }
        }

        // 5. Hàm đăng xuất tài khoản
        async function logout() {
            await supabase.auth.signOut();
            checkUserSession();
        }

        // Tự động kiểm tra trạng thái đăng nhập ngay khi học sinh vừa mở trang web lên
        checkUserSession();
    </script>
